<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Student Registration</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      text-align: center;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 10px;
      display: block;
      border-radius: 8px;
    }
    .sidebar a:hover {
      background: #34495e;
    }
    .main {
      flex: 1;
      padding: 20px;
      background: #f4f6f9;
    }
    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="index.html">➕ Register Student</a>
    <a href="index.html#list">📋 Student List</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <div class="main">
    <h1>Dashboard</h1>
    <div class="cards">
      <div class="card">
        <h2 id="totalStudents">0</h2>
        <p>Total Students</p>
      </div>
      <div class="card">
        <h2 id="totalCourses">0</h2>
        <p>Total Courses</p>
      </div>
    </div>
  </div>

  <script>
    // check login
    
    async function loadDashboard() {
      const res = await fetch("http://localhost:8080/students");
      const students = await res.json();
      document.getElementById("totalStudents").innerText = students.length;

      // Count unique courses
      const courses = new Set(students.map(s => s.course));
      document.getElementById("totalCourses").innerText = courses.size;
    }

    function logout(){
      localStorage.removeItem("auth");
      window.location.href = "login.html";
    }

    loadDashboard();
  </script>
</body>
</html>
