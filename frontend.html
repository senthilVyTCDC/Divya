<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    #sidebar { width: 220px; height: 100vh; background: #2c3e50; color: white; position: fixed; }
    #sidebar a { color: white; display: block; padding: 12px; text-decoration: none; }
    #sidebar a:hover { background: #34495e; }
    #content { margin-left: 240px; padding: 20px; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar">
    <h3 class="p-3">Student App</h3>
    <a href="#add">➕ Add Student</a>
    <a href="#list">📋 Student List</a>
  </div>

  <!-- Main Content -->
  <div id="content">
    <h2 id="add">Register New Student</h2>
    <form id="studentForm" class="mb-4">
      <input type="text" id="name" class="form-control mb-2" placeholder="Enter name" required>
      <input type="email" id="email" class="form-control mb-2" placeholder="Enter email" required>
      <input type="text" id="course" class="form-control mb-2" placeholder="Enter course" required>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <h2 id="list">All Students</h2>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>

  <script>
    const apiUrl = "http://localhost:8081/students";

    // Fetch all students
    async function fetchStudents() {
      const response = await fetch(apiUrl);
      const students = await response.json();
      const table = document.getElementById("studentTable");
      table.innerHTML = "";
      students.forEach(student => {
        const row = `
          <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.course}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
            </td>
          </tr>`;
        table.innerHTML += row;
      });
    }

    // Add new student
    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        course: document.getElementById("course").value
      };
      await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
      });
      e.target.reset();
      fetchStudents();
    });

    // Delete student
    async function deleteStudent(id) {
      await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
      fetchStudents();
    }

    // Load students on page load
    fetchStudents();
  </script>
</body>
</html>
