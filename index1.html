<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      position: fixed;
      height: 100vh;
      top: 0;
      left: 0;
      padding-top: 1rem;
      transition: transform 0.3s ease;
      z-index: 1030;
    }
    #sidebar a {
      color: white;
      display: block;
      padding: 12px 20px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
    }
    #sidebar a:hover {
      background: #34495e;
    }
    #content {
      margin-left: 240px;
      padding: 30px 40px;
      flex-grow: 1;
    }
    /* Table row hover */
    tbody tr:hover {
      background-color: #e9ecef;
      transition: background-color 0.3s ease;
    }
    /* Navbar */
    nav.navbar {
      background: #2c3e50;
    }
    nav.navbar .navbar-brand {
      color: white;
      font-weight: 600;
      font-size: 1.4rem;
    }
    /* Responsive Sidebar */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        transform: translateX(-100%);
      }
      #sidebar.show {
        transform: translateX(0);
      }
      #content {
        margin-left: 0;
        padding: 20px;
      }
      #sidebarToggle {
        display: inline-block;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        margin-left: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar sticky-top">
    <div class="container-fluid">
      <span id="sidebarToggle" class="d-md-none">&#9776;</span>
      <a class="navbar-brand" href="#">Student App</a>
    </div>
  </nav>

  <!-- Sidebar -->
  <div id="sidebar" class="d-md-block d-none">
    <h3 class="text-center mb-4">Student App</h3>
    <a href="#add">➕ Add Student</a>
    <a href="#list">📋 Student List</a>
  </div>

  <!-- Main Content -->
  <div id="content">
    <div class="card shadow-sm mb-5">
      <div class="card-body">
        <h2 id="add" class="mb-4">Register New Student</h2>
        <form id="studentForm" class="row g-3">
          <div class="col-md-4">
            <input type="text" id="name" class="form-control" placeholder="Enter name" required />
          </div>
          <div class="col-md-4">
            <input type="email" id="email" class="form-control" placeholder="Enter email" required />
          </div>
          <div class="col-md-3">
            <input type="text" id="course" class="form-control" placeholder="Enter course" required />
          </div>
          <div class="col-md-1 d-grid">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 id="list" class="mb-4">All Students</h2>
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiUrl = "http://localhost:8000/student/";

    // Sidebar toggle for small screens
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    sidebarToggle?.addEventListener('click', () => {
      sidebar.classList.toggle('show');
    });

    // Fetch all students
    async function fetchStudents() {
      const response = await fetch(apiUrl);
      const students = await response.json();
      const table = document.getElementById("studentTable");
      table.innerHTML = "";
      students.forEach(student => {
        const row = `
          <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.course}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
            </td>
          </tr>`;
        table.innerHTML += row;
      });
    }

    // Add new student
    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        course: document.getElementById("course").value
      };
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
      });
      if (response.ok) {
        e.target.reset();
        fetchStudents();
      } else {
        alert("Failed to add student.");
      }
    });

    // Delete student
    async function deleteStudent(id) {
  if (!confirm("Are you sure you want to delete this student?")) return;
  const response = await fetch(`${apiUrl}${id}/`, { method: "DELETE" });
 // Note the trailing slash here
  if (response.ok) fetchStudents();
  else alert("Failed to delete student.");
}


    // Load students on page load
    fetchStudents();
  </script>
</body>
</html>
